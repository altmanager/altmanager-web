<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading…</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="min-h-screen bg-zinc-900 font-features-['calt','ss02','cv03','cv04','cv11']">
    <div class="flex h-screen items-center justify-center">
      <svg
        class="size-12 text-white"
        xmlns="http://www.w3.org/2000/svg"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="12"
          r="9.5"
          fill="none"
          stroke-linecap="round"
          stroke-width="2"
        >
          <animateTransform
            attributeName="transform"
            dur="2s"
            from="0 12 12"
            repeatCount="indefinite"
            to="360 12 12"
            type="rotate"
          />
          <animate
            attributeName="stroke-dasharray"
            dur="1.5s"
            keyTimes="0;0.5;1"
            repeatCount="indefinite"
            values="0 150;42 150;42 150"
          />
          <animate
            attributeName="stroke-dashoffset"
            dur="1.5s"
            keyTimes="0;0.5;1"
            repeatCount="indefinite"
            values="0;-16;-59"
          />
        </circle>
        <circle
          cx="12"
          cy="12"
          r="9.5"
          fill="none"
          stroke-linecap="round"
          stroke-width="2"
          opacity=".1"
        />
      </svg>
    </div>
  </body>
</html>
